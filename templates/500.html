{% extends 'base.html' %}

{% block title %}Server Error - ExpenseMate{% endblock %}

{% block content %}
<div class="glass-card empty-state">
    <div class="empty-state-icon" aria-hidden="true" style="font-size: 6rem; color: var(--color-danger); text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);">500</div>
    <h1>Internal Server Error</h1>
    <p>Something went wrong on our end. Please try again later.</p>
    <div class="empty-state-action">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
