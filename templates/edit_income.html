{% extends 'base.html' %}

{% block title %}Edit Income - ExpenseMate{% endblock %}

{% block page_title %}Edit Income{% endblock %}

{% block content %}
<div class="glass-card">
    <form method="POST" action="{{ url_for('edit_income_page', id=income_record.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="amount">Amount *</label>
            <input type="number" step="0.01" min="0.01" max="99999999.99" name="amount" id="amount" class="form-control" value="{{ request.form.get('amount', income_record.amount) }}" required aria-required="true">
        </div>
        
        <div class="form-group">
            <label for="category_id">Category *</label>
            <select name="category_id" id="category_id" class="form-control" required aria-required="true">
                {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if request.form.get('category_id', income_record.category_id)|string == cat.id|string %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" name="description" id="description" class="form-control" maxlength="500" autocomplete="off" value="{{ request.form.get('description', income_record.description or '') }}">
        </div>

        <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" name="date" id="date" class="form-control" value="{{ request.form.get('date', income_record.date) }}" required aria-required="true" min="2000-01-01" max="2100-12-31">
        </div>

        <div class="form-group">
            <label for="source">Source</label>
            <input type="text" name="source" id="source" class="form-control" maxlength="500" autocomplete="off" value="{{ request.form.get('source', income_record.source or '') }}">
        </div>

        <div class="form-group">
            <label for="currency">Currency *</label>
            <select name="currency" id="currency" class="form-control" required aria-required="true">
                {% for c in currencies %}
                    <option value="{{ c }}" {% if request.form.get('currency', income_record.currency) == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Income</button>
            <a href="{{ url_for('income_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
